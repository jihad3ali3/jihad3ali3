name: Profile metrics

# Rebuilds the dashboard SVG used by README.md
# Powered by https://github.com/lowlighter/metrics
on:
  schedule:
    # Every day at 02:17 UTC (05:17 in Sanaa)
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

# Required so the action can push the generated SVG back to this repository
permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

env:
  # ---- Cyber violet / cyan accents (applied on top of the classic template) ----
  CYBER_CSS: |
    h1, h2, h3 {
      color: #8B5CF6 !important;
    }
    .field svg {
      fill: #22D3EE;
    }
    a {
      color: #22D3EE;
    }
  # Re-color the GitHub "green squares" (calendar + habit charts) into violet
  CYBER_JS: |
    const palette = {
      "#ebedf0": "#21262d",
      "#9be9a8": "#c4b5fd",
      "#40c463": "#8b5cf6",
      "#30a14e": "#6d28d9",
      "#216e39": "#4c1d95",
    }
    for (const [from, to] of Object.entries(palette)) {
      for (const node of document.querySelectorAll(`svg [fill="${from}"]`)) {
        node.setAttribute("fill", to)
      }
    }

jobs:
  metrics:
    name: Generate dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Token check
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::warning title=Using GITHUB_TOKEN::No METRICS_TOKEN secret found, so the dashboard falls back to the built-in GITHUB_TOKEN (public data only, private contributions will be missing). See METRICS.md."
          fi

      # Wide dashboard: header + activity + repositories + 3D calendar + languages + habits
      - name: Dashboard card (metrics.cyber.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.cyber.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: jihad3ali3
          template: classic
          config_display: large
          config_timezone: Asia/Aden
          config_animations: "yes"
          config_order: base.header, base.activity+community, base.repositories, isocalendar, languages, habits
          base: header, activity, repositories, metadata
          repositories: 100
          repositories_forks: "no"
          # 3D isometric contributions calendar + streaks
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
          # Languages breakdown
          plugin_languages: "yes"
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_analysis_timeout: 20
          plugin_languages_skipped: |
            jihad3ali3/camera_on_hostinger
            jihad3ali3/Camera_without_anything
            jihad3ali3/camera2
            jihad3ali3/jihad_Vps_sittiing
            jihad3ali3/ONE
            jihad3ali3/Testmgit_github1
            jihad3ali3/Testmgit_github
            jihad3ali3/TESTC
            jihad3ali3/skills-introduction-to-github
            jihad3ali3/replit
            jihad3ali3/replitLastVERSION
            jihad3ali3/-
          # Coding habits: facts + commit activity charts
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"
          plugin_habits_charts_type: classic
          extras_css: ${{ env.CYBER_CSS }}
          extras_js: ${{ env.CYBER_JS }}
          retries: 3
          retries_delay: 10
          plugins_errors_fatal: "no"
