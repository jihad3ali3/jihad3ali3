name: Profile metrics

# Rebuilds metrics.svg (the dashboard shown in README.md)
# Powered by https://github.com/lowlighter/metrics
on:
  schedule:
    # Every day at 02:17 UTC (05:17 in Sanaa)
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

# Required so the action can push the generated SVG back to this repository
permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

env:
  # ---- Blue / indigo / cyan accents (applied on top of the classic template) ----
  THEME_CSS: |
    h1, h2, h3 {
      color: #6366F1 !important;
    }
    .field svg {
      fill: #22D3EE;
    }
    a {
      color: #22D3EE;
    }
    /* calendar tiles + habit charts both read these variables */
    :root {
      --color-calendar-graph-day-bg: #21262d;
      --color-calendar-graph-day-L1-bg: #1E3A8A;
      --color-calendar-graph-day-L2-bg: #3B82F6;
      --color-calendar-graph-day-L3-bg: #6366F1;
      --color-calendar-graph-day-L4-bg: #22D3EE;
    }
  # Re-color the contribution graph into the same ramp.
  # GitHub swaps its palette by season (green in spring, halloween in october,
  # winter in december), so every known variant is mapped to keep the theme stable.
  THEME_JS: |
    const palette = {
      // default (green)
      "#ebedf0": "#21262d",
      "#9be9a8": "#1E3A8A",
      "#40c463": "#3B82F6",
      "#30a14e": "#6366F1",
      "#216e39": "#22D3EE",
      // halloween (october)
      "#ffee4a": "#1E3A8A",
      "#ffc501": "#3B82F6",
      "#fe9600": "#6366F1",
      "#03001c": "#22D3EE",
      // winter (december)
      "#0a3069": "#1E3A8A",
      "#0969da": "#3B82F6",
      "#54aeff": "#6366F1",
      "#b6e3ff": "#22D3EE",
    }
    // GitHub returns these colors as fill/stroke attributes (case may vary)
    for (const node of document.querySelectorAll("svg [fill], svg [stroke]")) {
      for (const attribute of ["fill", "stroke"]) {
        const value = node.getAttribute(attribute)?.toLowerCase()
        if (value && palette[value]) node.setAttribute(attribute, palette[value])
      }
    }

jobs:
  metrics:
    name: Generate dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Token check
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::warning title=Using GITHUB_TOKEN::No METRICS_TOKEN secret found, so the dashboard falls back to the built-in GITHUB_TOKEN (public data only, private contributions will be missing). See METRICS.md."
          fi

      # Wide dashboard: header + activity + repositories + 3D calendar + languages + habits
      - name: Dashboard card (metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: jihad3ali3
          template: classic
          config_display: large
          config_timezone: Asia/Aden
          config_animations: "yes"
          config_order: base.header, base.activity+community, base.repositories, isocalendar, languages, topics, habits, achievements, followup, reactions, lines
          base: header, activity, repositories, metadata
          repositories: 100
          repositories_forks: "no"
          # 3D isometric contributions calendar + streaks
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
          # Languages breakdown
          plugin_languages: "yes"
          plugin_languages_sections: most-used
          # percentages + lines + size, plus the "indepth" legend under the bar
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_indepth: "yes"
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_analysis_timeout: 45
          plugin_languages_skipped: |
            jihad3ali3/camera_on_hostinger
            jihad3ali3/Camera_without_anything
            jihad3ali3/camera2
            jihad3ali3/jihad_Vps_sittiing
            jihad3ali3/ONE
            jihad3ali3/Testmgit_github1
            jihad3ali3/Testmgit_github
            jihad3ali3/TESTC
            jihad3ali3/skills-introduction-to-github
            jihad3ali3/replit
            jihad3ali3/replitLastVERSION
            jihad3ali3/-
          # Mastered technologies: topic icons
          # (fill this by adding topics — laravel, php, mysql, react … — to your repositories)
          plugin_topics: "yes"
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          # Lines of code added / removed
          plugin_lines: "yes"
          # Achievements badges
          plugin_achievements: "yes"
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: "yes"
          # Recent activity on issues and pull requests
          plugin_followup: "yes"
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: "yes"
          # Reactions received on issues / pull requests
          plugin_reactions: "yes"
          plugin_reactions_limit: 200
          plugin_reactions_details: count, percentage
          # PageSpeed gauges (the 4 green circles in the reference card).
          # Needs a free Google PageSpeed API key + your live site URL. Uncomment both:
          # plugin_pagespeed: "yes"
          # plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          # plugin_pagespeed_url: https://example.com
          # Coding habits: facts + commit activity charts
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"
          plugin_habits_charts_type: classic
          extras_css: ${{ env.THEME_CSS }}
          extras_js: ${{ env.THEME_JS }}
          retries: 3
          retries_delay: 10
          plugins_errors_fatal: "no"
